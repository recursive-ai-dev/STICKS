<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medieval Stickman Sprites Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #2a2a2a;
            color: white;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .character-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .character-card {
            background: #3a3a3a;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .sprite-display {
            background: #4a4a4a;
            border-radius: 4px;
            padding: 10px;
            margin: 10px 0;
            position: relative;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sprite-sheet {
            max-width: 100%;
            height: auto;
            image-rendering: pixelated;
        }
        .character-info {
            font-size: 12px;
            color: #ccc;
            margin-top: 10px;
        }
        .direction-tabs {
            display: flex;
            gap: 5px;
            margin: 10px 0;
            justify-content: center;
        }
        .direction-tab {
            background: #555;
            border: none;
            color: white;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 3px;
            font-size: 12px;
        }
        .direction-tab.active {
            background: #007acc;
        }
        h1 {
            text-align: center;
            color: #ffd700;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #ccc;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚔️ Medieval Stickman Generator</h1>
        <p class="subtitle">Animated medieval characters with different classes, weapons, and armor</p>
        
        <div class="character-grid" id="characterGrid">
            <!-- Characters will be loaded here -->
        </div>
    </div>

    <script>
        const characters = [
            { id: 1, class: 'knight', name: 'Knight with Great Helm' },
            { id: 2, class: 'knight', name: 'Knight with Bascinet' },
            { id: 3, class: 'knight', name: 'Knight with Sallet' },
            { id: 4, class: 'knight', name: 'Knight with Great Helm' },
            { id: 5, class: 'archer', name: 'Hooded Archer' },
            { id: 6, class: 'archer', name: 'Archer with Coif' },
            { id: 7, class: 'mage', name: 'Mage with Circlet' },
            { id: 8, class: 'mage', name: 'Hooded Mage' },
            { id: 9, class: 'peasant', name: 'Hooded Peasant' },
            { id: 10, class: 'peasant', name: 'Peasant with Coif' }
        ];

        const directions = ['right', 'left', 'front', 'back'];

        function createCharacterCard(character) {
            const card = document.createElement('div');
            card.className = 'character-card';
            
            card.innerHTML = `
                <h3>${character.name}</h3>
                <div class="direction-tabs">
                    ${directions.map(dir => 
                        `<button class="direction-tab ${dir === 'right' ? 'active' : ''}" 
                                onclick="switchDirection(${character.id}, '${dir}')">${dir}</button>`
                    ).join('')}
                </div>
                <div class="sprite-display">
                    <img class="sprite-sheet" 
                         id="sprite-${character.id}" 
                         src="medieval_sprites/sheets/${character.id}_right_sheet.png" 
                         alt="${character.name} sprite sheet">
                </div>
                <div class="character-info">
                    <strong>Class:</strong> ${character.class}<br>
                    <strong>ID:</strong> ${character.id}
                </div>
            `;
            
            return card;
        }

        function switchDirection(characterId, direction) {
            const img = document.getElementById(`sprite-${characterId}`);
            img.src = `medieval_sprites/sheets/${characterId}_${direction}_sheet.png`;
            
            // Update active tab
            const card = img.closest('.character-card');
            const tabs = card.querySelectorAll('.direction-tab');
            tabs.forEach(tab => {
                tab.classList.remove('active');
                if (tab.textContent === direction) {
                    tab.classList.add('active');
                }
            });
        }

        // Initialize the grid
        const grid = document.getElementById('characterGrid');
        characters.forEach(character => {
            grid.appendChild(createCharacterCard(character));
        });
    </script>
</body>
</html>
