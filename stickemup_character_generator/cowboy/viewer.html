<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Stickemup — Local APNG Viewer</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#111; color:#eee; font:14px system-ui; }
  .stage { display:grid; place-items:center; padding:12px; border-radius:12px;
           background: conic-gradient(#ddd 25%,#fff 0 50%,#ddd 0 75%,#fff 0) 0 0/24px 24px; }
  .stage.white { background:#fff; }
  .stage.black { background:#000; }
  img { border-radius:10px; /* keep smooth (no pixelated) */ }
  .ui { position:fixed; left:0; right:0; bottom:0; display:flex; gap:.5rem; flex-wrap:wrap;
        justify-content:center; padding:.6rem .8rem; background:linear-gradient(180deg,transparent,#0008); }
  button { background:#1a1a1a; color:#eee; border:1px solid #333; border-radius:.5rem; padding:.4rem .6rem; }
  input[type="range"] { width:160px; }
  .label { text-shadow:0 1px 2px #0008; }
</style>
</head>
<body>

<div id="stage" class="stage">
  <img id="view" width="300" alt="APNG">
</div>

<div class="ui">
  <button id="prevBtn" type="button">◀ Prev</button>
  <button id="nextBtn" type="button">Next ▶</button>
  <button id="bgBtn"   type="button">Background</button>
  <label>Scale <input id="scale" type="range" min="1" max="8" value="3"></label>
  <span id="label" class="label"></span>
</div>

<script>
/* ====== CONFIG ====== */
const ASSET_DIR = "cowboy_sprites";     // or "cowboy_sprites" if that’s where your APNGs live
const DIRECTIONS = ["front","right","back","left"];
const EXT_ORDER = ["apng","png"];    // try .apng first, then .png
const MAX_ID = 64;                   // upper bound to probe; increase if needed
/* ==================== */

const img   = document.getElementById('view');
const stage = document.getElementById('stage');
const label = document.getElementById('label');
const scale = document.getElementById('scale');

let files = []; // [{name, url}]
let idx = 0;
let bgIdx = 0;

function setScale() {
  // your frames are ~100x100; adjust base if different
  const base = 100 * Number(scale.value);
  img.width = base;
}
scale.addEventListener('input', setScale);

function cycleBg(){
  bgIdx = (bgIdx + 1) % 3;
  stage.classList.remove('white','black');
  if (bgIdx === 1) stage.classList.add('white');
  if (bgIdx === 2) stage.classList.add('black');
}
document.getElementById('bgBtn').addEventListener('click', cycleBg);

document.getElementById('prevBtn').addEventListener('click', prevFile);
document.getElementById('nextBtn').addEventListener('click', nextFile);
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  prevFile();
  if (e.key === 'ArrowRight') nextFile();
  if (e.key.toLowerCase() === 'b') cycleBg();
});

function prevFile(){ if (!files.length) return; idx = (idx - 1 + files.length) % files.length; show(); }
function nextFile(){ if (!files.length) return; idx = (idx + 1) % files.length; show(); }

function show(){
  if (!files.length) { label.textContent = "No APNG/PNG found"; return; }
  const f = files[idx];
  label.textContent = `${idx+1}/${files.length} — ${f.name}`;
  img.src = f.url;
}

/* Probe existence by trying to load <img>. If it loads, we keep it; if it errors, skip. */
function probeImage(src){
  return new Promise(resolve => {
    const im = new Image();
    im.onload = () => resolve({ ok: true, src });
    im.onerror = () => resolve({ ok: false, src });
    im.src = src;
  });
}

async function discoverFiles(){
  const candidates = [];
  // Try both patterns: {id}_{dir}.{ext} and also flat {id}.{ext} (optional)
  for (let id = 1; id <= MAX_ID; id++) {
    for (const dir of DIRECTIONS) {
      for (const ext of EXT_ORDER) {
        candidates.push(`${ASSET_DIR}/${id}_${dir}.${ext}`);
      }
    }
    for (const ext of EXT_ORDER) {
      candidates.push(`${ASSET_DIR}/${id}.${ext}`);
    }
  }

  // Probe in batches to avoid hammering disk too hard
  const found = [];
  const batch = 24;
  for (let i = 0; i < candidates.length; i += batch) {
    const slice = candidates.slice(i, i + batch);
    const results = await Promise.all(slice.map(probeImage));
    for (const r of results) {
      if (r.ok) {
        const name = r.src.split("/").slice(-1)[0];
        found.push({ name, url: r.src });
      }
    }
  }

  // De-dup by preferring .apng over .png
  const map = new Map();
  for (const f of found) {
    const base = f.name.replace(/\.apng$/i, "").replace(/\.png$/i, "");
    if (!map.has(base) || /\.apng$/i.test(f.name)) map.set(base, f);
  }

  // Sort nicely (numeric id first, then direction order)
  files = Array.from(map.values()).sort((a,b)=>{
    const A = a.name.toLowerCase(), B = b.name.toLowerCase();
    // pull out leading id for sort
    const idA = parseInt(A, 10) || 0, idB = parseInt(B, 10) || 0;
    if (idA !== idB) return idA - idB;
    // direction bias
    const dirA = DIRECTIONS.findIndex(d => A.includes(`_${d}.`));
    const dirB = DIRECTIONS.findIndex(d => B.includes(`_${d}.`));
    return (dirA - dirB) || A.localeCompare(B, undefined, {numeric:true});
  });
}

(async function init(){
  setScale();
  await discoverFiles();
  idx = 0;
  show();
})();
</script>
</body>
</html>
